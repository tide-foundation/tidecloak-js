name: Deploy FairEnrol to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/fairenrol/**"
      - ".github/workflows/fairenrol-pages.yml"
  pull_request:
    paths:
      - "examples/fairenrol/**"
      - ".github/workflows/fairenrol-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fairenrol-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fairenrol
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/fairenrol/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/fairenrol/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
